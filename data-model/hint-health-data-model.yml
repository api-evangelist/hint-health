findings:
- 'Patient is the hub: 16 outbound relationships, including a self-reference (merged_into) that records
  patient-record merges and an `account` self-reference for family billing. Any agent walking the graph
  should start here.'
- Money is modelled as *_in_cents integers throughout; there is no currency field on the resources, so
  USD is implied by the platform rather than declared by the contract.
- The partner surface is a full CRUD marketplace API (products, app surfaces, highlights, links, testimonials,
  preconditions, backends, installations, api keys, webhook endpoints) that the repo's 49 refined specs
  do not yet cover.
