    official: true
    url: https://github.com/hinthealth/marketplace-skill
    pushed: '2026-08-12'
    note: >-
      Not a package — a first-party Agent Skill bundle (SKILL.md + four
      sub-skills) that builds and deploys a Hint marketplace partner app. Saved
      verbatim under skills/. Listed here so the GitHub org's one genuinely
      Hint-authored developer artifact is not mistaken for an SDK.

