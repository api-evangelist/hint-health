name: Hint Health Packages and Client Libraries
description: >-
  Hint ships exactly one first-party client artifact — hint-sdk.js, an
  unversioned browser SDK served straight off the API host for marketplace apps
  embedded in the Hint UI. There is no first-party server-side SDK in any
  package registry. The only backend client Hint names is a community Go
  library maintained by Spruce Health, which Hint itself labels
  "community-supported".
official_sdk_count: 1
community_package_count: 2

packages:
