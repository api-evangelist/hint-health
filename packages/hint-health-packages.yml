    official: true
    language: javascript
    registry: cdn
    url: https://api.hint.com/hint-sdk.js
    sandbox_url: https://api.sandbox.hint.com/hint-sdk.js
    docs: https://developers.hint.com/docs/js-sdk
    version: null
    published: null
    install: '<script src="https://api.hint.com/hint-sdk.js"></script>'
    probed:
      url: https://api.hint.com/hint-sdk.js
      http_status: 200
      content_type: text/javascript
      bytes: 3944
      checked: '2026-08-14'
    note: >-
      CDN-distributed, not in any package registry, and the script URL is
      UNPINNED — there is no version in the path, no version query parameter,
      and no version constant in the served source (a plain IIFE defining
      class HintSDK). A consumer cannot tell which build they loaded, and
      neither can we; version and published are therefore null by measurement,
      not by omission. Sandbox and production serve byte-identical 3,944-byte
      files at time of check.
    purpose: >-
      Browser bridge for Hint Marketplace apps embedded in an iframe —
      HintSDK.init(), .user, .currentPatient, .interaction, .close(),
      deep-link queryParams/fragment helpers, and an automatic ResizeObserver
      height report that Hint's clinical surfaces require to size the iframe.

  - name: go-hint
    official: false
    language: go
    registry: github
    url: https://github.com/sprucehealth/go-hint
    maintainer: Spruce Health engineering team
    version: null
    published: '2026-08-10'
    published_note: >-
      Last push date from the GitHub API. The repository publishes no semver
      tags to read a version from, so version is null; proxy.golang.org has no
      release to report either.
    note: >-
      Named by Hint's own Making Requests page as "one community-supported
      client library written in Go". Not first-party — the module lives in the
      sprucehealth org, and Hint asks other authors to email devsupport@hint.com
      so their libraries can be listed too. Actively maintained as of
      2026-08-10.

  - name: hint_health
    official: false
