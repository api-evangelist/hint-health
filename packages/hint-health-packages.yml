    registry: npm
    url: https://www.npmjs.com/package/hint_health
    version: 1.2.3
    published: '2021-01-07'
    maintainers: [josepiccioni]
    note: >-
      "A client library for hint health api." Unaffiliated third party — the
      sole npm maintainer is an individual (Jose Piccioni), the package declares
      no repository or homepage, and Hint does not list it among its libraries.
      Last published 2021-01-07, more than five years before the current API
      surface; treat as abandoned.

related_repositories:
