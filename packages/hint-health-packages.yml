findings:
  - >-
    A REST API with 150+ documented operations, PHI in the payloads, and a paid
    API-access add-on ships no first-party server-side SDK in any language. The
    integration path Hint actually invests in is the marketplace app plus its
    agent skill, not a client library.
  - >-
    hint-sdk.js is unpinned. Every embedded marketplace app loads whatever build
    is current, with no integrity attribute and no way to lock a version — a
    supply-chain and reproducibility gap in a HIPAA-scoped surface.
