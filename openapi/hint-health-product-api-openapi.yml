components:
  schemas:
    ProductSanitizer:
      type: object
      properties:
        name:
          type: string
          description: Display name of the marketplace listing.
        slug:
          type: string
          description: URL-safe identifier (e.g. "my-product"). Only settable on create — contact Hint support to change it later.
        type:
          type: string
          description: Kind of marketplace listing.
          enum:
          - app
          - integration
          - solution
        summary:
          type: string
          description: Short tagline shown on the marketplace card (max 80 chars).
        built_by_name:
          type: string
          description: Display name of the maker, shown under the listing as "Built by <name>".
        built_by_url:
          type: string
          description: Url the "Built by" link points to.
        icon:
          type: string
          description: Listing icon as a base64 data URI (e.g. "data:image/png;base64,..."). **Note the field-name asymmetry:** the request field is `icon` (data URI input); the GET response surfaces the uploaded image as `icon_url` (hosted URL). Sending `icon_url` as a request field is silently ignored. The listing icon is distinct from the Core Page sidebar icon (`surface.core_page_icon`) — see the surface endpoints for that.
    Public.BackendBlueprint_min:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Public.ProductBlueprint_one:
      type: object
      properties:
        id:
          type: string
        built_by_name:
          type: string
        built_by_url:
          type: string
        icon_url:
          type: string
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
        partner_backend:
          $ref: '#/components/schemas/Public.BackendBlueprint_min'
    Public.ProductBlueprint_all:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          built_by_name:
            type: string
          built_by_url:
            type: string
          icon_url:
            type: string
          name:
            type: string
          slug:
            type: string
          summary:
            type: string
          partner_backend:
            $ref: '#/components/schemas/Public.BackendBlueprint_min'
  securitySchemes:
    hint_api_key:
      type: apiKey
      name: AUTHORIZATION
      in: header
      description: 'Enter your token in the format: `Bearer {your_api_key}`'
