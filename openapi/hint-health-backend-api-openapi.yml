paths:
  /partner/backends:
    get:
      tags:
      - Backend
      operationId: Backend.ListBackends
      summary: List Partner Backends
      description: 'Each backend owns its own webhook delivery, OAuth config, and product

        catalog.'
      parameters:
      - name: limit
        in: query
        required: false
        description: Allows limiting the number of partner backends returned.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Allows offsetting the start of the returned page.
        schema:
          type: integer
          format: int32
      - name: created_at
        in: query
        required: false
        description: Allows filtering by date or time. Accepts an object with allowed keys of [gte, gt, lte, lt] and a value of the date or time in iso8601 format. See [advanced querying](https://developers.hint.com/reference/making-requests#advanced-querying) for more information.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public.BackendBlueprint_all'
              example:
              - id: pbnd-ab12C345DeF6
                activation_type: instant
                auth_type: manual
                created_at: '2017-02-05T06:23:00.000000-08:00'
                listened_events:
                - '*'
                localhost_redirect_url: http://localhost:3000/login?from=hint
                localhost_webhook_url: null
                max_requests_per_minute: null
                name: Default
                redirect_url: https://hint-partner-emr.com/login?from=hint
                unmute_self_webhooks: false
                updated_at: '2017-02-05T06:23:00.000000-08:00'
                webhooks_disabled: false
                webhooks_paused: false
                api_credentials_configuration: null
                products: []
                webhooks_signature_api_key:
                  id: i22X3eTjsV9kfNapfpuKYPrFU0hINpK9tVG3
                  label: null
                  created_at: '2017-02-05T06:23:00.000000-08:00'
                  last_used_at: null
                  deactivated_at: null
          headers:
