                  alt: Hint-Partner EMR overview screenshot
    patch:
      tags:
      - PartnerProductOverview
      operationId: PartnerProductOverview.UpdateProductOverview
      summary: Update Product Overview
      description: ''
      parameters:
      - name: product_id
        in: path
        required: true
