components:
  schemas:
    Public.LocationBlueprint_min:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    CompanyCreateSanitizer:
      type: object
      properties:
        default_plan:
          $ref: '#/components/schemas/Association'
          description: You must use plans of type "company"
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
    Association:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    PhoneNumber:
      type: object
      properties:
        id:
          type: string
        number:
          type: number
        type:
          type: string
        us_formattable:
          type: boolean
          description: Make this false if your number is not exactly 10 digits
      required:
      - number
      - type
    Public.EmployeeDivisionBlueprint_leaf:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Public.PlanBlueprint_min:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        plan_type:
          type: string
    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
      required:
      - line1
      - city
      - state
      - zip
    Public.CompanyBlueprint_one:
      type: object
      properties:
        id:
          type: string
        employee_divisions_count:
          type: integer
          format: int32
        name:
          type: string
        status:
          type: string
        address:
          $ref: '#/components/schemas/Public.AddressBlueprint_leaf'
        default_location:
          $ref: '#/components/schemas/Public.LocationBlueprint_min'
        default_plan:
          $ref: '#/components/schemas/Public.PlanBlueprint_min'
        default_practitioner:
          $ref: '#/components/schemas/Public.PractitionerBlueprint_min'
        employee_divisions:
          $ref: '#/components/schemas/Public.EmployeeDivisionBlueprint_leaf'
        phones:
          $ref: '#/components/schemas/Public.PhoneBlueprint_leaf'
    CompanyUpdateSanitizer:
      type: object
      properties:
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
    Public.CompanyBlueprint_all:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          employee_divisions_count:
            type: integer
            format: int32
          name:
            type: string
          status:
            type: string
          address:
            $ref: '#/components/schemas/Public.AddressBlueprint_leaf'
          default_location:
            $ref: '#/components/schemas/Public.LocationBlueprint_min'
          default_plan:
            $ref: '#/components/schemas/Public.PlanBlueprint_min'
          default_practitioner:
            $ref: '#/components/schemas/Public.PractitionerBlueprint_min'
          employee_divisions:
            $ref: '#/components/schemas/Public.EmployeeDivisionBlueprint_leaf'
          phones:
            $ref: '#/components/schemas/Public.PhoneBlueprint_leaf'
    Public.AddressBlueprint_leaf:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        country:
          type: string
        line1:
          type: string
        line2:
          type: string
        state:
          type: string
        zip:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
    Public.PractitionerBlueprint_min:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Public.PhoneBlueprint_leaf:
      type: object
      properties:
        number:
          type: string
        type:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Practice access token or Partner API key (Bearer authentication)
    hint_api_key:
      type: apiKey
      name: AUTHORIZATION
      in: header
      description: 'Enter your token in the format: `Bearer {your_api_key}`'
x-refined-from:
- hint-health-hint-health-api-openapi.yml
- hint-health-partner-endpoints-2026-07-01-openapi.yml
