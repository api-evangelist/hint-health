              schema:
                $ref: '#/components/schemas/Public.CompanyBlueprint_one'
              example:
                id: com-ab12C345DeF6
                employee_divisions_count: 0
                name: Schmoogle Inc.
                status: active
                address:
                  id: add-ab12C345DeF6
                  city: New York
                  country: United States
                  line1: 157 E Houston St
                  line2: Suite 2402
                  state: NY
                  zip: '10002'
                  latitude: 40.7227998
                  longitude: -73.9892241
                default_location: null
                default_plan:
                  id: pln-ab12C345DeF6
