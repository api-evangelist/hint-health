paths:
  /provider/appointment_types:
    get:
      tags:
      - Appointment
      operationId: Appointment.ListAllAppointmentTypes
      summary: List All Appointment Types
      description: 'Returns the practice''s active appointment types. Inactive, archived, and deleted appointment types

        are excluded. As a result, an appointment''s `appointment_type_id` may reference a type that no longer

        appears in this list (for example, one archived after the appointment was booked). Treat an

        unfamiliar `appointment_type_id` as an unknown/retired type rather than an error.'
      parameters:
      - name: limit
        in: query
        required: false
        description: Defaults to 10, maximum 100.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Defaults to 0.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public.AppointmentTypeBlueprint_all'
              example:
              - id: appty-3f9a2b7c4d1e6058
                name: Discovery Call
                duration: 30
                created_at: '2026-04-30T09:00:00.000Z'
                updated_at: '2026-05-06T13:55:00.000Z'
              - id: appty-8b1c5e9a2f7d3406
                name: Follow-up Visit
                duration: 15
                created_at: '2026-05-02T10:00:00.000Z'
                updated_at: '2026-05-02T10:00:00.000Z'
              - id: appty-c4a7f2e83b9d1560
                name: Annual Physical
                duration: 60
                created_at: '2026-05-01T15:30:00.000Z'
                updated_at: '2026-05-07T08:12:00.000Z'
          headers:
            X-Count:
              description: The number of resources returned in this request
              schema:
                type: integer
            X-Total-Count:
              description: The total number of resources available (scoped to query params)
              schema:
                type: integer
  /provider/appointments:
    get:
      tags:
      - Appointment
      operationId: Appointment.ListAllAppointments
      summary: List All Appointments
      description: 'Declined appointments are not returned by this endpoint.

        Recurring appointments are stored once and expanded into one appointment object per occurrence

        that falls within `start_date`/`end_date`. Occurrences that haven''t been individually modified

        share the base appointment''s `id`; once an occurrence''s status is changed (for example, checking

        a patient in), it''s returned as its own appointment with a new `id` and a `recurring_appointment_id`

        pointing back to the original recurring appointment. See [Recurring Appointments](https://developers.hint.com/docs/recurring-appointments)

        for details, including what happens when a series is edited after an occurrence has already split off.'
      parameters:
      - name: start_date
        in: query
        required: false
        description: Start of the query window (inclusive). Must be a valid ISO 8601 date string.
        schema:
          type: string
      - name: end_date
        in: query
        required: false
        description: End of the query window (inclusive). Must be a valid ISO 8601 date string. Range may not exceed 31 days.
        schema:
          type: string
      - name: patient
        in: query
        required: false
        description: Filter by patient attendee. A patient id, such as `pat-` (or `sbx-pat-` in sandbox).
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: ' Allows filtering appointments by status.'
        schema:
          type: array
          items:
            type: string
            enum:
            - unconfirmed
            - confirmed
            - cancelled
      - name: limit
        in: query
        required: false
        description: Defaults to 10, maximum 100.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Defaults to 0.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public.AppointmentBlueprint_all'
              example:
              - id: appt-ab12C345DeF6
                start: '2026-05-06T14:00:00.000Z'
                end: '2026-05-06T14:30:00.000Z'
                status: confirmed
                workflow_status: waiting_for_provider
                title: Annual wellness visit
                description: Routine annual physical and wellness check-in.
                created_at: '2026-04-30T09:00:00.000Z'
                updated_at: '2026-05-06T13:55:00.000Z'
                appointment_type_id: appty-3f9a2b7c4d1e6058
                recurring_appointment_id: appt-Cd34E567FgH8
                host:
                  id: user-ab12C345DeF6
