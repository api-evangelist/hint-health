paths:
  /provider/companies/{company_id}/sponsorships:
    post:
      tags:
      - Sponsorship
      operationId: Sponsorship.CreateSponsorship
      summary: Create Sponsorship
      description: ''
      parameters:
      - name: company_id
        in: path
        required: true
        description: Unique Company ID
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                id: creg-ab12C345DeF6
                external_id: ext_id_from_another_system012345
                is_subscriber: false
                type: spouse
                family:
                  id: cac-ab12C345DeF6
                patient:
                  id: pat-ab12C345DeF6
                  name: oxana renquist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Provider.CompanySponsorshipsController.create_body'
      security:
      - BearerAuth: []
    get:
      tags:
      - Sponsorship
      operationId: Sponsorship.ListSponsorships
      summary: List All Sponsorhips
      description: ''
      parameters:
      - name: company_id
        in: path
        required: true
        description: Unique Company ID
        schema:
          type: string
      - name: family_id
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
