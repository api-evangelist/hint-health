paths:
  /partner/api_keys:
    get:
      tags:
      - ApiKey
      operationId: ApiKey.ListApiKeys
      summary: List API Keys
      description: ''
      parameters:
      - name: limit
        in: query
        required: false
        description: Allows limiting the number of API keys returned.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Allows offsetting the start of the returned page.
        schema:
          type: integer
          format: int32
      - name: label
        in: query
        required: false
        description: Filter by exact label match.
        schema:
          type: string
      - name: created_at
        in: query
        required: false
        description: Allows filtering by date or time. Accepts an object with allowed keys of [gte, gt,
          lte, lt] and a value of the date or time in iso8601 format. See [advanced querying](https://developers.hint.com/reference/making-requests#advanced-querying)
          for more information.
        schema:
          type: string
          format: date-time
      - name: last_used_at
        in: query
        required: false
        description: Same shape as `created_at`.
        schema:
          type: string
          format: date-time
      - name: deactivated_at
        in: query
        required: false
        description: 'Same shape as `created_at`. Pass `{ "is_present": true }` to include only deactivated
          keys.'
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public.ApiKeyBlueprint_all'
              example:
              - created_at: '2017-02-05T06:23:00.000000-08:00'
                deactivated_at: null
                label: API Key
                last_used_at: null
                token_last_4: tVG3
              - created_at: '2017-02-05T06:23:00.000000-08:00'
                deactivated_at: null
                label: API Key
                last_used_at: null
                token_last_4: tVG3
              - created_at: '2017-02-05T06:23:00.000000-08:00'
                deactivated_at: null
                label: API Key
                last_used_at: null
                token_last_4: tVG3
          headers:
            X-Count:
              description: The number of resources returned in this request
              schema:
                type: integer
            X-Total-Count:
              description: The total number of resources available (scoped to query params)
              schema:
                type: integer
    post:
      tags:
      - ApiKey
      operationId: ApiKey.CreateApiKey
      summary: Create API Key
      description: 'The full `token` value is only returned in this response. Store it

        securely — it cannot be retrieved later.'
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Public.ApiKeyBlueprint_one'
              example:
                id: i22X3eTjsV9kfNapfpuKYPrFU0hINpK9tVG3
                created_at: '2017-02-05T06:23:00.000000-08:00'
                deactivated_at: null
                label: API Key
                last_used_at: null
                token: i22X3eTjsV9kfNapfpuKYPrFU0hINpK9tVG3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Partner.ApiKeysController.create_body'
