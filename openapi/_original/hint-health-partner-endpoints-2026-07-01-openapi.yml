  /partner/installations:
    get:
      tags:
      - Installation
      operationId: Installation.ListInstallations
      summary: List Installations
      description: 'Returns the partner''s installations — one per (product × practice connection). Each
        row carries the

        connected practice and product and survives the install/uninstall cycle (deactivated installs
        are

        returned too).'
      parameters:
      - name: limit
        in: query
        required: false
        description: Allows limiting the number of installations returned.
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        required: false
        description: Allows offsetting the start of the returned page.
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        description: Filter by installation status (`onboarding`, `pending`, `active`, `deactivated`).
        schema:
          type: string
      - name: created_at
        in: query
        required: false
        description: Allows filtering by date or time. Accepts an object with allowed keys of [gte, gt,
          lte, lt] and a value of the date or time in iso8601 format. See [advanced querying](https://developers.hint.com/reference/making-requests#advanced-querying)
